mutation SaveCategory(
  $key: UUID!, $id: UUID, $slug: String!, $name: String!, $description: String,
  $archived: Boolean!
) @auth(level: USER_EMAIL_VERIFIED) {
  commerceCommand_insert(data: {
    actorUid_expr: "auth.uid", idempotencyKey: $key, kind: "SAVE_CATEGORY",
    input_expr: """
      {
        'id': (has(vars.id) ? vars.id : null),
        'slug': vars.slug,
        'name': vars.name,
        'description': (has(vars.description) ? vars.description : null),
        'archived': vars.archived
      }
    """
  })
}

