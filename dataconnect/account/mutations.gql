mutation UpdateMyProfile($key: UUID!, $name: String!, $phone: String) @auth(level: USER) {
  commerceCommand_insert(data: {
    actorUid_expr: "auth.uid", idempotencyKey: $key, kind: "UPDATE_PROFILE",
    input_expr: "{'name': vars.name, 'phone': (has(vars.phone) ? vars.phone : null)}"
  })
}

mutation SaveAddress(
  $key: UUID!, $id: UUID, $label: String!, $recipient: String!, $phone: String!,
  $line1: String!, $line2: String, $district: String!, $city: String!, $stateCode: String!,
  $postalCode: String!, $primary: Boolean!
) @auth(level: USER) {
  commerceCommand_insert(data: {
    actorUid_expr: "auth.uid", idempotencyKey: $key, kind: "SAVE_ADDRESS",
    input_expr: """
      {
        'id': (has(vars.id) ? vars.id : null),
        'label': vars.label,
        'recipient': vars.recipient,
        'phone': vars.phone,
        'line1': vars.line1,
        'line2': (has(vars.line2) ? vars.line2 : null),
        'district': vars.district,
        'city': vars.city,
        'stateCode': vars.stateCode,
        'postalCode': vars.postalCode,
        'primary': vars.primary
      }
    """
  })
}

